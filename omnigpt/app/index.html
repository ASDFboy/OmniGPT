<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OmniGPT</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<aside id="side">
  <button class="new" id="new"><i data-i="plus"></i>New chat</button>
  <div class="row2"><button class="ghost sm" id="newf"><i data-i="folder"></i>Folder</button><button class="ghost sm" id="newp"><i data-i="project"></i>Project</button></div>
  <input id="csearch" type="search" placeholder="Search chats" spellcheck="false">
  <div id="chats"></div>
  <button class="ghost" id="console"><i data-i="console"></i>OmniRoute console</button>
  <button class="ghost" id="sched"><i data-i="clock"></i>Scheduled tasks</button>
  <button class="ghost" id="gear"><i data-i="sliders"></i>Settings</button>
</aside>
<main>
<header>
  <button class="ib" id="tog" title="Sidebar (Ctrl+B)"><i data-i="menu"></i></button>
  <span class="brand" id="brand">OmniGPT</span><span class="omstat" id="omstat"></span><span class="omstat" id="bpstat"></span><span class="omstat" id="usage"></span><button class="omstat jobstat" id="jobstat" hidden title="Background jobs started by the agents"></button>
  <label class="sw" id="omwrap"><input type="checkbox" id="omforever"><span></span>Run indefinitely</label>
  <span class="grow"></span>
  <datalist id="models"></datalist>
  <label class="sw"><input type="checkbox" id="pc" checked><span></span>PC access</label>
  <input type="checkbox" id="think" checked hidden>
</header>
<div class="work"><div class="left"><div id="thread"><div class="col" id="col"></div></div>
<footer>
  <div id="chips"></div>
  <div class="box">
    <button id="attach" title="Attach files"><i data-i="clip"></i></button><button id="attachdir" class="attach2" title="Attach a folder"><i data-i="folder"></i></button><input type="file" id="file" multiple hidden>
    <textarea id="in" rows="1" placeholder="Message" autofocus></textarea>
    <button class="btn" id="omstop" hidden>Stop</button>
    <div class="modewrap"><button id="modebtn" type="button" title="Models"><span id="modelabel">Default</span><i data-i="chev"></i></button><div id="modemenu" hidden></div></div>
    <button id="send" title="Send"><i data-i="send"></i></button>
  </div>
  <div class="note" id="note"></div>
</footer>
</div><div id="brainpane"><canvas id="brain"></canvas></div></div>
</main>
<dialog id="dlg" class="set">
  <nav id="s-nav"><div class="s-title">Settings</div>
    <button data-p="general">General</button><button data-p="models">Models</button><button data-p="memory">Memory</button><button data-p="skills">Skills</button><button data-p="connection">Connection</button><button data-p="accounts">Accounts</button><button data-p="agents">Agents and safety</button><button data-p="activity">Activity</button><button data-p="data">Data</button><button data-p="about">About</button></nav>
  <section id="s-body"></section>
  <button class="ib s-close" id="s-x" title="Close"><i data-i="close"></i></button>
</dialog>
<dialog id="jdlg">
  <h3 style="margin:0 0 10px">Background jobs</h3>
  <p class="mut" style="margin:0 0 10px">Programs the agents started with start_process. They stop when OmniGPT closes.</p>
  <div id="j-list"></div>
  <div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="btn" id="j-x">Close</button></div>
</dialog>
<dialog id="adlg">
  <h3 id="a-t"></h3><p class="mut" id="a-p"></p><input id="a-in">
  <div class="arow"><button class="btn" id="a-no">Cancel</button><button class="btn pri" id="a-ok">OK</button></div>
</dialog>
<dialog id="tdlg">
  <h3 style="margin:0 0 10px">Scheduled tasks</h3>
  <div id="t-list"></div>
  <label>Name</label><input id="t-name">
  <label>Prompt</label><textarea id="t-prompt"></textarea>
  <label>Schedule</label>
  <div class="trow2">
    <select id="t-type"><option value="daily">Daily</option><option value="weekly">Weekly</option><option value="interval">Every N minutes</option><option value="once">Once</option></select>
    <span id="t-f-time"><input type="time" id="t-time" value="09:00"></span>
    <span id="t-f-int" hidden><input type="number" id="t-min" value="60" min="1"></span>
    <span id="t-f-once" hidden><input type="datetime-local" id="t-at"></span>
  </div>
  <div id="t-f-days" hidden><div id="t-days"></div></div>
  <label>Project</label><select id="t-proj"></select>
  <label class="sw" style="margin-top:12px"><input type="checkbox" id="t-pc" checked><span></span>PC access</label>
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button class="btn" id="t-x">Close</button><button class="btn pri" id="t-add">Add task</button></div>
</dialog>
<script>
const TOKEN0="__TOKEN__"; let TOKEN=TOKEN0; // per backend launch
</script>
<script src="brain.js"></script>
<script src="app.js"></script>
</body>
</html>
